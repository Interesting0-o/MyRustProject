[package]
name = "book_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
  "mysql",
  "runtime-tokio",  # 异步运行时
  "tls-native-tls",
] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
