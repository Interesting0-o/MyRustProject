[package]
name = "book_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
  "mysql",
  "runtime-tokio",  # 异步运行时
  "tls-native-tls",
  "macros",         # sqlx::migrate! 等宏
  "migrate",        # 数据库迁移
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
